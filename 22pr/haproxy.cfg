global
  daemon
  maxconn 256

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend http_front
  bind *:8080
  default_backend http_back

backend http_back
  balance roundrobin
  server backend1 127.0.0.1:3000 check
  server backend2 127.0.0.1:3001 check
  server backend3 127.0.0.1:3002 check backup
